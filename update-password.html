<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ubah Password - BBM Parfume</title>
  <link rel="icon" href="https://i.ibb.co/0RSmbB11/image.png" type="image/png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:20px;background:#080808;color:#e0e0e0;font-family:"Segoe UI",Arial,sans-serif}.card{width:100%;max-width:410px;padding:38px 34px;background:#131313;border:1px solid #2a2a2a;border-radius:20px;box-shadow:0 20px 60px #0009}.logo{text-align:center;margin-bottom:26px}.logo img{width:70px;height:70px;border-radius:50%;object-fit:contain}.logo h1{margin-top:10px;color:#f5c542;font-size:1.45rem}.logo p{margin-top:4px;color:#888;font-size:.86rem}.group{margin-bottom:17px}label{display:block;margin-bottom:6px;color:#aaa;font-size:.85rem;font-weight:600}input{width:100%;padding:12px 16px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;font-size:1rem}input:focus{outline:none;border-color:#f5c542;box-shadow:0 0 0 3px #f5c54226}button{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#f5c542,#d4a020);color:#111;font-size:1rem;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.message{display:none;margin:14px 0;text-align:center;font-size:.86rem;line-height:1.45}.message.show{display:block}.message.error{color:#ff6b6b}.message.info{color:#f5c542}.back{text-align:center;margin-top:17px}.back a{color:#888;text-decoration:none;font-size:.85rem}.back a:hover{color:#f5c542}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img src="https://i.ibb.co/0RSmbB11/image.png" alt="BBM"><h1>BUAT PASSWORD BARU</h1><p>Gunakan minimal 8 karakter</p></div>
    <div id="status" class="message info show">Memeriksa link pemulihan...</div>
    <form id="resetForm" hidden>
      <div class="group"><label for="newPassword">Password Baru</label><input type="password" id="newPassword" minlength="8" autocomplete="new-password" required></div>
      <div class="group"><label for="confirmPassword">Ulangi Password Baru</label><input type="password" id="confirmPassword" minlength="8" autocomplete="new-password" required></div>
      <button type="submit" id="saveBtn">Simpan Password Baru</button>
    </form>
    <div class="back"><a href="/login-karyawan.html">← Kembali ke Login</a></div>
  </main>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/+esm";
    const supabase=createClient("https://glpgqvxicoskabwvashd.supabase.co","sb_publishable_SGrBZoI_E0DKxRnIjwPALg_08oWGA5U",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const status=document.getElementById("status"),form=document.getElementById("resetForm"),saveBtn=document.getElementById("saveBtn");
    const show=(text,type="info")=>{status.textContent=text;status.className=`message show ${type}`};

    async function prepare(){
      await new Promise(resolve=>setTimeout(resolve,500));
      const {data:{session}}=await supabase.auth.getSession();
      if(!session){show("Link reset tidak valid atau sudah kedaluwarsa. Minta link baru dari halaman login.","error");return}
      show("Link berhasil diverifikasi. Silakan buat password baru.");
      form.hidden=false;
    }

    form.addEventListener("submit",async event=>{
      event.preventDefault();
      const password=document.getElementById("newPassword").value,confirm=document.getElementById("confirmPassword").value;
      if(password.length<8)return show("Password minimal 8 karakter.","error");
      if(password!==confirm)return show("Konfirmasi password tidak sama.","error");
      saveBtn.disabled=true;saveBtn.textContent="Menyimpan...";
      const {error}=await supabase.auth.updateUser({password});
      if(error){show(error.message,"error");saveBtn.disabled=false;saveBtn.textContent="Simpan Password Baru";return}
      await supabase.auth.signOut();
      show("Password berhasil diubah. Silakan login menggunakan password baru.");
      form.hidden=true;
      setTimeout(()=>location.replace("/login-karyawan.html"),1800);
    });
    prepare();
  </script>
</body>
</html>
