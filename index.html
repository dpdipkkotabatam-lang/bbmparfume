<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Website Pertama Saya</title>

    <meta
        name="description"
        content="Website pertama saya yang dibuat menggunakan HTML dan dipublikasikan melalui Cloudflare Pages."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #303030 0%,
                    #111111 45%,
                    #050505 100%
                );
            color: white;
        }

        header {
            width: 100%;
            padding: 20px 8%;
            border-bottom: 1px solid rgba(255, 215, 0, 0.35);
            background: rgba(0, 0, 0, 0.7);
        }

        nav {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            color: #ffd700;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;
        }

        .menu {
            display: flex;
            gap: 22px;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }

        .menu a:hover {
            color: #ffd700;
        }

        main {
            min-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .hero {
            width: 100%;
            max-width: 900px;
            padding: 60px 35px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.06);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 215, 0, 0.08);
            backdrop-filter: blur(10px);
        }

        .hero span {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            border: 1px solid #ffd700;
            border-radius: 50px;
            color: #ffd700;
            font-size: 14px;
        }

        .hero h1 {
            margin-bottom: 20px;
            font-size: clamp(38px, 7vw, 72px);
            line-height: 1.05;
        }

        .hero h1 strong {
            color: #ffd700;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto 30px;
            color: #d5d5d5;
            font-size: 18px;
            line-height: 1.7;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .button {
            display: inline-block;
            min-width: 160px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .button-primary {
            background: #ffd700;
            color: #111111;
        }

        .button-secondary {
            border: 1px solid #ffd700;
            color: #ffd700;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        footer {
            padding: 25px 20px;
            text-align: center;
            color: #999999;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            .menu {
                display: none;
            }

            .hero {
                padding: 45px 20px;
            }

            .hero p {
                font-size: 16px;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a class="logo" href="#">WEBKU</a>

            <div class="menu">
                <a href="#beranda">Beranda</a>
                <a href="#tentang">Tentang</a>
                <a href="#kontak">Kontak</a>
            </div>
        </nav>
    </header>

    <main id="beranda">
        <section class="hero">
            <span>Website Pertama Saya</span>

            <h1>
                Selamat Datang di
                <strong>Website Saya</strong>
            </h1>

            <p>
                Website ini dibuat menggunakan HTML dan CSS,
                disimpan di GitHub, kemudian dipublikasikan
                melalui Cloudflare Pages.
            </p>

            <div class="buttons">
                <a
                    class="button button-primary"
                    href="#tentang"
                >
                    Lihat Selengkapnya
                </a>

                <a
                    class="button button-secondary"
                    href="#kontak"
                >
                    Hubungi Kami
                </a>
            </div>
        </section>
    </main>

    <footer>
        © 2026 Website Pertama Saya
    </footer>

</body>
</html>
