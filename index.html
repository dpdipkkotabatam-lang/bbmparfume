<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BBM Parfume</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="icon" href="https://i.ibb.co/0RSmbB11/image.png" type="image/png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #080808;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #131313;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .login-container .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-container .logo img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: contain;
    }

    .login-container .logo h1 {
      color: #f5c542;
      font-size: 1.5rem;
      margin-top: 10px;
    }

    .login-container .logo p {
      color: #888;
      font-size: 0.85rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      transition: 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #f5c542;
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f5c542, #d4a020);
      border: 0;
      border-radius: 10px;
      color: #111;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(245, 197, 66, 0.25);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 12px;
      text-align: center;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .back-link {
      text-align: center;
      margin-top: 16px;
    }

    .back-link a {
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link a:hover {
      color: #f5c542;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="https://i.ibb.co/0RSmbB11/image.png" alt="BBM" />
      <h1>BBM PARFUME</h1>
      <p>Login Karyawan</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email"><i class="fas fa-envelope" style="margin-right:6px;"></i> Email</label>
        <input type="email" id="email" placeholder="masukkan email" required />
      </div>
      <div class="form-group">
        <label for="password"><i class="fas fa-lock" style="margin-right:6px;"></i> Password</label>
        <input type="password" id="password" placeholder="masukkan password" required />
      </div>
      <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> Login</button>
      <div id="errorMsg" class="error-msg">Email atau password salah.</div>
    </form>

    <div class="back-link">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Kembali ke Website</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://glpgqvxicoskabwvashd.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_SGrBZoI_E0DKxRnIjwPALg_08oWGA5U";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password,
      });

      if (error) {
        errorMsg.textContent = error.message || "Login gagal.";
        errorMsg.classList.add("show");
        return;
      }

      if (data.session) {
        window.location.href = "karyawan.html";
      }
    });

    // Cek jika sudah login
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.href = "karyawan.html";
    }
  </script>
</body>
</html>
