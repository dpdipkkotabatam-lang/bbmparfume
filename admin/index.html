<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admin · BBM Parfume</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#080808;--panel:#121212;--panel2:#191919;--gold:#f6c744;--text:#f5f5f5;--muted:#aaa;--line:#2a2a2a;--danger:#ef4444;--ok:#22c55e}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:radial-gradient(circle at top,#25200f 0,#080808 35%);color:var(--text);min-height:100vh}.hidden{display:none!important}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(430px,100%);padding:30px;border:1px solid #3a3217;border-radius:20px;background:rgba(18,18,18,.96);box-shadow:0 24px 80px #000}.logo{text-align:center;color:var(--gold);font-size:2.2rem;margin-bottom:8px}.box h1{text-align:center;margin:0 0 8px}.muted{color:var(--muted)}label{display:block;font-size:.84rem;font-weight:700;margin:16px 0 7px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b0b0b;color:#fff;padding:12px 13px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--gold)}button,.btn{border:0;border-radius:10px;padding:12px 16px;font:700 .92rem Inter;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:linear-gradient(135deg,var(--gold),#a87412);color:#111}.secondary{background:#252525;color:#fff;border:1px solid #333}.danger{background:#3a1111;color:#fecaca;border:1px solid #6b1d1d}.full{width:100%;margin-top:18px}.msg{margin-top:13px;padding:11px;border-radius:9px;font-size:.87rem}.error{background:#3b1111;color:#fecaca}.success{background:#0d321c;color:#bbf7d0}.top{position:sticky;top:0;z-index:5;background:rgba(8,8,8,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;color:var(--gold)}.main{padding:34px 0 60px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.head h1{margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stat strong{display:block;font-size:1.6rem;color:var(--gold)}.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:.78rem;color:var(--muted);text-transform:uppercase}td img{width:54px;height:54px;border-radius:9px;object-fit:cover}.actions{display:flex;gap:8px}.iconbtn{padding:9px 11px}.status{padding:5px 9px;border-radius:999px;font-size:.75rem;font-weight:800}.on{background:#12351f;color:#bbf7d0}.off{background:#372020;color:#fecaca}.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:18px}.modalbox{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #4b401c;border-radius:18px;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.check{display:flex;align-items:center;gap:9px;margin-top:16px}.check input{width:auto}.footactions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}@media(max-width:700px){.stats{grid-template-columns:1fr}.head{align-items:stretch;flex-direction:column}.grid2{grid-template-columns:1fr}.topin{min-height:64px}.hide-sm{display:none}}
</style>
</head>
<body>
<section id="loginView" class="login"><form id="loginForm" class="box"><div class="logo"><i class="fas fa-spray-can-sparkles"></i></div><h1>Panel Admin</h1><p class="muted" style="text-align:center">Masuk menggunakan akun Supabase kamu.</p><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary full" type="submit"><i class="fas fa-right-to-bracket"></i> Masuk</button><div id="loginMsg"></div></form></section>
<div id="dashboard" class="hidden"><header class="top"><div class="wrap topin"><div class="brand"><i class="fas fa-gem"></i> BBM PARFUME ADMIN</div><div style="display:flex;gap:8px"><a class="btn secondary hide-sm" href="../" target="_blank"><i class="fas fa-globe"></i> Lihat Website</a><button id="logoutBtn" class="danger"><i class="fas fa-arrow-right-from-bracket"></i> Logout</button></div></div></header><main class="wrap main"><div class="head"><div><h1>Kelola Produk</h1><div class="muted">Tambah, edit, aktifkan, atau hapus produk.</div></div><button id="addBtn" class="primary"><i class="fas fa-plus"></i> Tambah Produk</button></div><section class="stats"><div class="stat"><span class="muted">Total Produk</span><strong id="totalProducts">0</strong></div><div class="stat"><span class="muted">Produk Aktif</span><strong id="activeProducts">0</strong></div><div class="stat"><span class="muted">Total Stok</span><strong id="totalStock">0</strong></div></section><section class="panel"><div class="tablewrap"><table><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="productRows"><tr><td colspan="5" class="muted">Memuat...</td></tr></tbody></table></div></section></main></div>
<div id="productModal" class="modal hidden"><form id="productForm" class="modalbox"><div class="modalhead"><h2 id="modalTitle">Tambah Produk</h2><button id="closeModal" type="button" class="secondary iconbtn"><i class="fas fa-xmark"></i></button></div><input id="productId" type="hidden"><label>Nama produk</label><input id="name" required maxlength="100"><label>Deskripsi/aroma</label><textarea id="description" rows="3" maxlength="250"></textarea><div class="grid2"><div><label>Harga (Rp)</label><input id="price" type="number" min="0" step="1000" required></div><div><label>Stok</label><input id="stock" type="number" min="0" step="1" value="0" required></div></div><label>URL gambar</label><input id="imageUrl" type="url" required placeholder="https://..."><label>Urutan tampil</label><input id="sortOrder" type="number" min="0" value="0"><label class="check"><input id="isActive" type="checkbox" checked> Tampilkan produk di website</label><div id="formMsg"></div><div class="footactions"><button id="cancelBtn" type="button" class="secondary">Batal</button><button type="submit" class="primary"><i class="fas fa-floppy-disk"></i> Simpan</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://glpgqvxicoskabwvashd.supabase.co';
const SUPABASE_KEY='sb_publishable_SGrBZoI_E0DKxRnIjwPALg_08oWGA5U';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let products=[];
const rupiah=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function msg(el,text,type='error'){el.innerHTML=text?`<div class="msg ${type}">${esc(text)}</div>`:''}
async function init(){const {data:{session}}=await db.auth.getSession();show(session);db.auth.onAuthStateChange((_e,s)=>show(s))}
function show(session){$('loginView').classList.toggle('hidden',!!session);$('dashboard').classList.toggle('hidden',!session);if(session)loadProducts()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg($('loginMsg'),'');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg($('loginMsg'),error.message)})
$('logoutBtn').addEventListener('click',()=>db.auth.signOut());
async function loadProducts(){const {data,error}=await db.from('products').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error){$('productRows').innerHTML=`<tr><td colspan="5" class="muted">${esc(error.message)}. Jalankan file setup.sql di Supabase SQL Editor.</td></tr>`;return}products=data||[];render()}
function render(){$('totalProducts').textContent=products.length;$('activeProducts').textContent=products.filter(p=>p.is_active).length;$('totalStock').textContent=products.reduce((a,p)=>a+Number(p.stock||0),0);$('productRows').innerHTML=products.length?products.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:11px"><img src="${esc(p.image_url)}"><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.description||'')}</div></div></div></td><td>${rupiah(p.price)}</td><td>${Number(p.stock||0)}</td><td><span class="status ${p.is_active?'on':'off'}">${p.is_active?'Aktif':'Nonaktif'}</span></td><td><div class="actions"><button class="secondary iconbtn" onclick="editProduct('${p.id}')"><i class="fas fa-pen"></i></button><button class="danger iconbtn" onclick="deleteProduct('${p.id}','${esc(p.name).replace(/'/g,'&#39;')}')"><i class="fas fa-trash"></i></button></div></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Belum ada produk.</td></tr>'}
function openModal(p=null){$('productForm').reset();$('productId').value=p?.id||'';$('modalTitle').textContent=p?'Edit Produk':'Tambah Produk';$('name').value=p?.name||'';$('description').value=p?.description||'';$('price').value=p?.price||35000;$('stock').value=p?.stock||0;$('imageUrl').value=p?.image_url||'';$('sortOrder').value=p?.sort_order||0;$('isActive').checked=p?.is_active??true;msg($('formMsg'),'');$('productModal').classList.remove('hidden')}
function closeModal(){$('productModal').classList.add('hidden')}
$('addBtn').onclick=()=>openModal();$('closeModal').onclick=closeModal;$('cancelBtn').onclick=closeModal;
window.editProduct=id=>openModal(products.find(p=>p.id===id));
window.deleteProduct=async(id,name)=>{if(!confirm(`Hapus produk “${name}”?`))return;const {error}=await db.from('products').delete().eq('id',id);if(error)alert(error.message);else loadProducts()}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();msg($('formMsg'),'');const id=$('productId').value;const payload={name:$('name').value.trim(),description:$('description').value.trim(),price:Number($('price').value),stock:Number($('stock').value),image_url:$('imageUrl').value.trim(),sort_order:Number($('sortOrder').value),is_active:$('isActive').checked,updated_at:new Date().toISOString()};const q=id?db.from('products').update(payload).eq('id',id):db.from('products').insert(payload);const {error}=await q;if(error)msg($('formMsg'),error.message);else{closeModal();loadProducts()}});
init();
</script></body></html>
