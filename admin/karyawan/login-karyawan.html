<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Karyawan - BBM Parfume</title>
  <link rel="icon" href="https://i.ibb.co/0RSmbB11/image.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #080808;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: #131313;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo img {
      width: 70px; height: 70px; border-radius: 50%;
      object-fit: contain;
    }
    .logo h1 { color: #f5c542; font-size: 1.5rem; margin-top: 10px; }
    .logo p { color: #888; font-size: .85rem; }
    .form-group { margin-bottom: 18px; }
    label {
      display: block; font-size: .85rem; color: #aaa;
      margin-bottom: 6px; font-weight: 600;
    }
    input {
      width: 100%; padding: 12px 16px; background: #1a1a1a;
      border: 1px solid #2a2a2a; border-radius: 10px;
      color: white; font-size: 1rem;
    }
    input:focus {
      outline: none; border-color: #f5c542;
      box-shadow: 0 0 0 3px rgba(245,197,66,.15);
    }
    button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg,#f5c542,#d4a020);
      border: 0; border-radius: 10px; color: #111;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .message {
      display: none; margin-top: 12px; text-align: center;
      font-size: .86rem; line-height: 1.4;
    }
    .message.show { display: block; }
    .message.error { color: #ff6b6b; }
    .message.info { color: #f5c542; }
    .back-link { text-align: center; margin-top: 16px; }
    .back-link a { color: #888; text-decoration: none; font-size: .85rem; }
    .back-link a:hover { color: #f5c542; }
    .forgot-wrap { text-align: right; margin: -8px 0 18px; }
    .forgot-btn {
      width: auto; padding: 0; background: transparent; color: #f5c542;
      font-size: .84rem; font-weight: 600;
    }
    .forgot-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="https://i.ibb.co/0RSmbB11/image.png" alt="BBM">
      <h1>BBM PARFUME</h1>
      <p>Login Karyawan</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="email">✉ Email</label>
        <input type="email" id="email" name="email"
               placeholder="masukkan email" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">🔒 Password</label>
        <input type="password" id="password" name="password"
               placeholder="masukkan password" autocomplete="current-password" required>
      </div>

      <div class="forgot-wrap">
        <button type="button" class="forgot-btn" id="forgotBtn">Lupa Password?</button>
      </div>

      <button type="submit" id="loginBtn">
        <span id="loginText">↪ Login</span>
      </button>

      <div id="message" class="message"></div>
    </form>

    <div class="back-link">
      <a href="/">← Kembali ke Website</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/+esm";

    const SUPABASE_URL = "https://glpgqvxicoskabwvashd.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_SGrBZoI_E0DKxRnIjwPALg_08oWGA5U";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const loginText = document.getElementById("loginText");
    const message = document.getElementById("message");
    const forgotBtn = document.getElementById("forgotBtn");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function setLoading(isLoading) {
      loginBtn.disabled = isLoading;
      loginText.textContent = isLoading ? "Memproses..." : "↪ Login";
    }

    function timeout(ms = 15000) {
      return new Promise((_, reject) =>
        setTimeout(() => reject(
          new Error("Koneksi terlalu lama. Coba matikan VPN/adblock lalu ulangi.")
        ), ms)
      );
    }

    async function login(email, password) {
      const result = await Promise.race([
        supabase.auth.signInWithPassword({ email, password }),
        timeout()
      ]);

      if (result.error) throw result.error;
      if (!result.data?.user) throw new Error("Data pengguna tidak ditemukan.");

      const { data: profil, error: profilError } = await Promise.race([
        supabase
          .from("karyawan")
          .select("nama_lengkap, role, status")
          .eq("auth_user_id", result.data.user.id)
          .maybeSingle(),
        timeout()
      ]);

      if (profilError) throw profilError;

      if (!profil) {
        await supabase.auth.signOut();
        throw new Error("Akun Auth belum terhubung ke tabel karyawan.");
      }

      if (profil.status !== "aktif") {
        await supabase.auth.signOut();
        throw new Error("Akun sedang dinonaktifkan.");
      }

      if (profil.role === "admin") {
        window.location.replace("/admin/");
      } else {
        window.location.replace("/panel-karyawan.html");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Email dan password wajib diisi.");
        return;
      }

      setLoading(true);

      try {
        await login(email, password);
      } catch (error) {
        console.error("Login error:", error);
        showMessage(error?.message || "Login gagal. Periksa email dan password.");
        setLoading(false);
      }
    });

    forgotBtn.addEventListener("click", async () => {
      clearMessage();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        showMessage("Masukkan email terlebih dahulu, lalu tekan Lupa Password.", "info");
        document.getElementById("email").focus();
        return;
      }

      forgotBtn.disabled = true;
      forgotBtn.textContent = "Mengirim...";
      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: `${window.location.origin}/update-password.html`
        });
        if (error) throw error;
        showMessage("Link reset password sudah dikirim. Periksa kotak masuk atau folder Spam.", "info");
      } catch (error) {
        showMessage(error?.message || "Gagal mengirim email reset password.");
      } finally {
        forgotBtn.disabled = false;
        forgotBtn.textContent = "Lupa Password?";
      }
    });

    // Tidak ada redirect otomatis saat halaman dibuka.
    // Ini mencegah halaman login berputar karena redirect loop.
  </script>
</body>
</html>
